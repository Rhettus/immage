version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # shows when darktable's master has moved. review it, never merge it as
  # it is: a new pin goes through the render comparison in
  # app/docs/dev/darktable-pin.md
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly

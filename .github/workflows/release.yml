name: release

# a tag v<version> makes a draft release: macOS, Windows and both Linux builds,
# the updater's signed bundles, the source archive, and latest.json, which
# installed copies read once the release is published
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag is the app's version, and has release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          for f in app/src-tauri/tauri.conf.json app/package.json; do
            got=$(jq -r .version "$f")
            if [ "$got" != "$v" ]; then echo "::error file=$f::version $got, but the tag is $TAG"; exit 1; fi
          done
          got=$(sed -n 's/^version = "\(.*\)"$/\1/p' app/src-tauri/Cargo.toml | head -1)
          if [ "$got" != "$v" ]; then echo "::error file=app/src-tauri/Cargo.toml::version $got, but the tag is $TAG"; exit 1; fi
          if ! grep -Eq "^## v?${v//./\\.}( |$)" RELEASE_NOTES.md; then
            echo "::error file=RELEASE_NOTES.md::no section \"## $v\""; exit 1
          fi

  build:
    needs: version
    uses: $/.github/workflows/build.yml
    with:
      release: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/source_archive.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-source
          path: build/immage-*-source.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: latest.json and the release text
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I scripts/release_assets.py "$RUNNER_TEMP/artifacts" "${TAG#v}" "$RUNNER_TEMP/release/assets"
      # a draft, published by hand after the binaries are tried: only then
      # does /releases/latest/download/latest.json offer it to installed copies.
      # a re-run replaces the draft's files, and never touches a published one
      - name: draft release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/release"
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo "::error::$TAG is already published"; exit 1; fi
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" assets/* --draft --verify-tag --title "Immage ${TAG#v}" --notes-file body.md
          fi

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: system packages for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev
      - run: sh app/scripts/fetch_immporter.sh
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - name: cargo clippy
        working-directory: app/src-tauri
        # tauri's build script checks that the bundled resources exist; the
        # engine is not built in this job, so stand-ins are enough
        run: |
          mkdir -p resources/darktable
          touch resources/notices.txt
          cargo clippy --locked -- -D warnings

  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # cmake reads these when build.sh configures darktable
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # no submodules here: scripts/build.sh checks out darktable and only
      # the submodules of its own that the engine needs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: homebrew packages
        run: brew bundle install --file .github/Brewfile
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-arm64
          max-size: 2G
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - run: sh scripts/build.sh
        env:
          # darktable's FindONNXRuntime.cmake asks the GitHub API for the
          # archive's hash; unauthenticated, the runner's shared IP is
          # rate-limited and configure fails
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-macos-arm64
          path: build/dmg/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      # the runner's git turns LF into CRLF on checkout, which breaks the
      # shell scripts and makes the darktable patch fail to apply
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the packages app/WINDOWS.md lists, plus ccache
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git intltool po4a
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-python-jsonschema mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-drmingw mingw-w64-ucrt-x86_64-exiv2 mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-gettext mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-imath
            mingw-w64-ucrt-x86_64-iso-codes mingw-w64-ucrt-x86_64-lcms2 mingw-w64-ucrt-x86_64-lensfun
            mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-libavif mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-libjxl mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libraw mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp mingw-w64-ucrt-x86_64-libxml2 mingw-w64-ucrt-x86_64-omp
            mingw-w64-ucrt-x86_64-openexr mingw-w64-ucrt-x86_64-openjpeg2 mingw-w64-ucrt-x86_64-potrace
            mingw-w64-ucrt-x86_64-pugixml mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-json-glib
      # restore and save as separate steps: actions/cache only saves when the
      # job succeeds, and a failed engine build is when the cache helps most
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-x64-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      # the engine, in MSYS2's shell, which does not see Windows' Node: the
      # node packages are installed from PowerShell below
      - run: sh scripts/build.sh
        shell: msys2 {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ccache -s
        if: always()
        shell: msys2 {0}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: the app and its installers
        run: |
          cd immporter; npm ci
          cd ..\app; npm ci
          npm run tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-windows-x64
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    # an AppImage runs where glibc is at least as new as the build's, so it
    # is built on the oldest Ubuntu the runners have: 22.04, glibc 2.35
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      # darktable needs gcc 12; 22.04's default is 11
      CC: gcc-12
      CXX: g++-12
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Tauri bundles with linuxdeploy, itself an AppImage, which otherwise
      # needs FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the PPAs darktable's own AppImage build uses, for newer image
      # format libraries than 22.04 has
      - name: system packages
        run: |
          sudo add-apt-repository -y ppa:savoury1/graphics
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo add-apt-repository -y ppa:savoury1/display
          sudo apt-get update
          sudo apt-get install -y $(grep -v '^#' .github/ubuntu-packages.txt)
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-x64
          max-size: 2G
      - run: sh app/scripts/build_linux_deps.sh
      # the newest lens database, which bundle_engine.py ships; it exits
      # non-zero when there is nothing newer than the package's
      - run: sudo lensfun-update-data || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - run: sh scripts/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-linux-x64
          path: app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      checks_only:
        description: Run validation without rebuilding platform packages
        type: boolean
        default: false
      diagnostic_x64:
        description: Build only Linux x86_64 plus checks for a native diagnostic run
        type: boolean
        default: false
      launcher_experiment:
        description: Repack only the released x86_64 AppImage with the experimental launcher
        type: boolean
        default: false
  # release.yml's builds reuse dependency caches and sign updater bundles
  # (app/src-tauri/tauri.release.conf.json)
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher-experiment:
    if: ${{ inputs.launcher_experiment && !inputs.checks_only }}
    uses: $/.github/workflows/launcher-experiment.yml

  checks:
    if: ${{ !inputs.launcher_experiment }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history, for gitleaks
          fetch-depth: 0
      - name: release asset checks
        run: python3 -I scripts/test_release_assets.py
      - name: model pin checks
        run: python3 -I scripts/test_pin_models.py
      - name: upstream copy checks
        run: python3 -I scripts/test_check_upstream_copies.py
      - name: gitleaks
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_${v}_linux_x64.tar.gz" | sha256sum -c
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner "$GITHUB_WORKSPACE"
      - name: zizmor
        run: pipx run zizmor==1.31.1 --persona=regular --format=github .github/workflows
        env:
          # for its online audits: known-vulnerable and impostor action pins
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: system packages for tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev
      - run: sh app/scripts/fetch_immporter.sh
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - name: no HTML or code injection sinks
        run: sh scripts/check_web_sinks.sh
      # the other verify/*.test.mjs need a built engine; list new engine-free ones here
      - name: front-end checks that need no engine
        run: |
          node --test \
            verify/agx-profiles.test.mjs \
            verify/ai-mask-paste.test.mjs \
            verify/chord-actions.test.mjs \
            verify/color-range.test.mjs \
            verify/contrast-equalizer.test.mjs \
            verify/crop-corner.test.mjs \
            verify/crop-transition.test.mjs \
            verify/detail-preview.test.mjs \
            verify/engine-commands.test.mjs \
            verify/engine-state.test.mjs \
            verify/fit-preview.test.mjs \
            verify/gpu-check.test.mjs \
            verify/menus.test.mjs \
            verify/module-others.test.mjs \
            verify/perf-diagnostics.test.mjs \
            verify/performance-tuner.test.mjs \
            verify/perf-tracing.test.mjs \
            verify/pixel-worker.test.mjs \
            verify/preview-handoff.test.mjs \
            verify/saturation-curve.test.mjs \
            verify/theme.test.mjs \
            verify/ui-updates.test.mjs
      - run: npm audit --omit=dev --audit-level=high
        working-directory: app
      # rust-cache saves nothing after an exact hit, so an entry saved before
      # `cargo test` joined this job (clippy's output only) was restored and
      # kept forever, and the tests compiled from cold every run (~9 min).
      # change this key when the job's cargo steps change
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: clippy-test
      - name: cargo clippy
        working-directory: app/src-tauri
        # tauri's build script checks that the bundled resources exist; the
        # engine is not built in this job, so stand-ins are enough
        run: |
          mkdir -p resources/darktable resources/webext
          touch resources/notices.txt
          cargo clippy --locked -- -D warnings
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --locked
      # fails on a RustSec vulnerability in Cargo.lock; unmaintained and
      # unsound crates (all from tauri and gtk-rs) are only reported
      - name: cargo audit
        working-directory: app/src-tauri
        # the release binary: `cargo install` compiles for 5 minutes, and the
        # rust cache does not save it again on an exact hit
        run: |
          v=0.22.2 t=x86_64-unknown-linux-gnu
          curl -fsSL -o "$RUNNER_TEMP/cargo-audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$v/cargo-audit-$t-v$v.tgz"
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP" --strip-components 1 "cargo-audit-$t-v$v/cargo-audit"
          "$RUNNER_TEMP/cargo-audit" audit

  macos:
    if: ${{ !inputs.launcher_experiment && !inputs.diagnostic_x64 && !inputs.checks_only }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # cmake reads these when build.sh configures darktable
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # no submodules here: scripts/build.sh checks out darktable and only
      # the submodules of its own that the engine needs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: homebrew packages
        run: brew bundle install --file .github/Brewfile
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos-arm64
          max-size: 2G
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - run: sh scripts/build.sh
        env:
          # darktable's FindONNXRuntime.cmake asks the GitHub API for the
          # archive's hash; unauthenticated, the runner's shared IP is
          # rate-limited and configure fails
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # a release's: the updater's bundles, signed
          IMMAGE_TAURI_CONFIG: ${{ inputs.release && format('{0}/app/src-tauri/tauri.release.conf.json', github.workspace) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-macos-arm64
          path: |
            build/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  windows:
    if: ${{ !inputs.launcher_experiment && !inputs.diagnostic_x64 && !inputs.checks_only }}
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      # the runner's git turns LF into CRLF on checkout, which breaks the
      # shell scripts and makes the darktable patch fail to apply
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the packages app/WINDOWS.md lists, plus ccache
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git intltool po4a
            mingw-w64-ucrt-x86_64-cc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-python-jsonschema mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-drmingw mingw-w64-ucrt-x86_64-exiv2 mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-gettext mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-imath
            mingw-w64-ucrt-x86_64-iso-codes mingw-w64-ucrt-x86_64-lcms2 mingw-w64-ucrt-x86_64-lensfun
            mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-libavif mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-libjxl mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libraw mingw-w64-ucrt-x86_64-librsvg mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-libwebp mingw-w64-ucrt-x86_64-libxml2 mingw-w64-ucrt-x86_64-omp
            mingw-w64-ucrt-x86_64-openexr mingw-w64-ucrt-x86_64-openjpeg2 mingw-w64-ucrt-x86_64-potrace
            mingw-w64-ucrt-x86_64-pugixml mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-json-glib
      # restore and save as separate steps: actions/cache only saves when the
      # job succeeds, and a failed engine build is when the cache helps most
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit-cache
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-x64-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      # the engine, in MSYS2's shell, which does not see Windows' Node: the
      # node packages are installed from PowerShell below
      - run: sh scripts/build.sh
        shell: msys2 {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: ccache -s
        if: always()
        shell: msys2 {0}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() }}
        with:
          path: .ccache
          key: ccache-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: the app and its installers
        run: |
          cd immporter; npm ci
          cd ..\app; npm ci
          if ($env:IMMAGE_TAURI_CONFIG) { npm run tauri build -- --config $env:IMMAGE_TAURI_CONFIG }
          else { npm run tauri build }
        env:
          # a release's: the updater's bundles, signed
          IMMAGE_TAURI_CONFIG: ${{ inputs.release && format('{0}/app/src-tauri/tauri.release.conf.json', github.workspace) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-windows-x64
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe*
          if-no-files-found: error

  linux:
    if: ${{ !inputs.launcher_experiment && !inputs.checks_only }}
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.diagnostic_x64 && '[{"arch":"x64","runner":"ubuntu-22.04","cc":"gcc-14","cxx":"g++-14"}]' || '[{"arch":"x64","runner":"ubuntu-22.04","cc":"gcc-14","cxx":"g++-14"},{"arch":"arm64","runner":"ubuntu-22.04-arm","cc":"gcc-14","cxx":"g++-14"}]') }}
    # Build the bundled WebKit on glibc 2.35, including for Mint 22.x.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Tauri bundles with linuxdeploy, itself an AppImage, which otherwise
      # needs FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: system packages and WebKitGTK build dependencies
        run: |
          sudo add-apt-repository -y ppa:savoury1/graphics
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo add-apt-repository -y ppa:savoury1/display
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          packages=$(grep -v '^#' .github/ubuntu-packages.txt)
          # Jammy ARM64 lacks these PPA libraries; build_linux_deps supplies
          # them before WebKit is configured (including its JPEG XL dependency).
          if [ "$(uname -m)" = aarch64 ]; then
            packages=$(printf '%s\n' "$packages" | grep -Ev '^(libjxl-dev|libsharpyuv-dev|libopenexr-dev)$')
          fi
          # The runner can have LLVM's conflicting libunwind development files.
          # Keep libunwind's runtime and headers on the same Ubuntu version.
          printf '%s\n' 'Package: libunwind8 libunwind-dev' 'Pin: release o=Ubuntu' 'Pin-Priority: 1001' | sudo tee /etc/apt/preferences.d/immage-libunwind
          sudo apt-get install -y --allow-downgrades $packages libunwind-dev libunwind-14-dev-
      - run: sh app/scripts/build_linux_deps.sh
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit-cache
        with:
          path: build/webkitgtk/install
          key: webkitgtk-2.54.2-ubuntu22-${{ matrix.arch }}-${{ matrix.cc }}-${{ hashFiles('app/scripts/build_webkitgtk.sh', 'patches/webkitgtk-*.patch') }}
      - name: build WebKitGTK 2.54.2
        run: sh app/scripts/build_webkitgtk.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ steps.webkit-cache.outputs.cache-hit != 'true' }}
        with:
          path: build/webkitgtk/install
          key: webkitgtk-2.54.2-ubuntu22-${{ matrix.arch }}-${{ matrix.cc }}-${{ hashFiles('app/scripts/build_webkitgtk.sh', 'patches/webkitgtk-*.patch') }}
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-ubuntu22-webkit254-${{ matrix.arch }}
          max-size: 2G
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
          key: linux-ubuntu22-webkit254-${{ matrix.arch }}
      - run: npm ci
        working-directory: app
      - run: sh scripts/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # a release's: the updater's bundles, signed
          IMMAGE_TAURI_CONFIG: ${{ inputs.release && format('{0}/app/src-tauri/tauri.release.conf.json', github.workspace) || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - name: test WebKit packaging checks
        run: |
          python3 -I scripts/test_webkit_bundle.py
          python3 -I scripts/test_appimage_launcher.py
      - name: verify bundled WebKitGTK and JavaScriptCore
        run: |
          python3 -I app/scripts/check_webkit_bundle.py \
            app/src-tauri/target/release/bundle/appimage/Immage.AppDir 2.54.2 --max-glibc 2.35
          python3 -I app/scripts/check_appimage_launcher.py app/src-tauri/target/release/bundle/appimage/Immage.AppDir
      - name: diagnostic build identity and instructions
        if: ${{ inputs.diagnostic_x64 }}
        working-directory: app/src-tauri/target/release/bundle/appimage
        run: |
          sha256sum *.AppImage > diagnostic-SHA256SUMS.txt
          printf 'Diagnostic commit: %s\n' "$GITHUB_SHA" > diagnostic-README.txt
          cat >> diagnostic-README.txt <<'EOF'
          Unsigned manual-test build; no release or updater publication.
          Close installed Immage. Extract this archive, then:
            sha256sum -c diagnostic-SHA256SUMS.txt
            chmod +x ./*.AppImage
          Launch the AppImage and open the same copied photo used for 0.41.1.
          Preferences > Performance > Measuring > GUI benchmark > Run.
          Run once at 100% and once at 125%; record scale and refresh rate.
          Keep the app visible, with the same window size and performance settings.
          Return both JSON reports from the benchmarks folder shown when finished.
          Preview resolution is unchanged. These reports add transport diagnostics.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immage-linux-${{ matrix.arch }}
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage*
            app/src-tauri/target/release/bundle/appimage/diagnostic-*.txt
          if-no-files-found: error

<rect x="420" y="470" width="260" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="550.0" y="493.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">group "immage: Face"</text>
<text x="550.0" y="510.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">its own shapes</text>
<rect x="780" y="195.0" width="300" height="174" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="930.0" y="247.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">combined mask</text>
<text x="930.0" y="264.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">"immage combined:</text>
<text x="930.0" y="282.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">colorbalancergb 1"</text>
<text x="930.0" y="299.5" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">members summed (SUM),</text>
<text x="930.0" y="317.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">up to 1</text>
<rect x="780" y="470" width="300" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="930.0" y="493.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">combined mask</text>
<text x="930.0" y="510.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">"... colorbalancergb 2"</text>
<rect x="1180" y="130" width="400" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1380.0" y="149.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">exposure · color calibration · ...</text>
<text x="1380.0" y="166.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">the global modules</text>
<rect x="1180" y="206" width="400" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1380.0" y="225.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">color balance rgb  ◆ mask anchor</text>
<text x="1380.0" y="242.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">global Saturation</text>
<rect x="1180" y="282" width="400" height="56" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="1380.0" y="301.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">immage local: colorbalancergb 1</text>
<text x="1380.0" y="318.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Saturation +40, the strongest member</text>
<rect x="1180" y="358" width="400" height="56" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="1380.0" y="377.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">immage local: colorbalancergb 2</text>
<text x="1380.0" y="394.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Saturation -30</text>
<rect x="1180" y="434" width="400" height="56" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="1380.0" y="453.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">color balance rgb · Sky, Trees, ...</text>
<text x="1380.0" y="470.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">each mask's own: off, holding its settings</text>
<rect x="1180" y="510" width="400" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1380.0" y="538.0" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">AgX or sigmoid (tone mapper)</text>
<text x="40.0" y="634.0" font-size="14" fill="#495057" text-anchor="start" dominant-baseline="middle" font-weight="normal">Each member counts at its strength over the shared one (20 / 40 = 0.5), times its Opacity. darktable blends out = in + mask · (module(in) - in), so Trees gets about Saturation +20.</text>
<text x="40.0" y="660.0" font-size="14" fill="#495057" text-anchor="start" dominant-baseline="middle" font-weight="normal">Masks are grouped by the direction of their sliders, or by slider and sign: Face, pointing the other way, gets an instance of its own. Ten masks raising Saturation still run the module once.</text>
<text x="40.0" y="686.0" font-size="14" fill="#495057" text-anchor="start" dominant-baseline="middle" font-weight="normal">Where members overlap the sum adds up, as in Lightroom; the shared strength is set for where it adds up most, as the combined mask stops at 1. Here they do not overlap, so it is the strongest member's.</text>
<text x="40.0" y="712.0" font-size="14" fill="#495057" text-anchor="start" dominant-baseline="middle" font-weight="normal">Dragging Trees lifts it out of combined mask 1 onto its own instance, which runs after the shared ones: the drag reruns only that. It joins again on release.</text>

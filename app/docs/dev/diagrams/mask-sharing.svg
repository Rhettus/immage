<text x="40.0" y="14.0" font-size="28" fill="#1e1e1e" text-anchor="start" dominant-baseline="middle" font-weight="600">Immage: masks sharing one instance through a combined mask</text>
<rect x="60" y="140" width="260" height="64" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="190.0" y="163.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">Mask "Sky"</text>
<text x="190.0" y="180.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Saturation +40</text>
<rect x="420" y="140" width="260" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>

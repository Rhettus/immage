<rect x="420" y="250" width="260" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="550.0" y="273.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">group "immage: Trees"</text>
<text x="550.0" y="290.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">its own shapes</text>
<rect x="60" y="360" width="260" height="64" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="190.0" y="383.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">Mask "Field"</text>
<text x="190.0" y="400.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Saturation +10</text>
<rect x="420" y="360" width="260" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="550.0" y="383.2" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="600">group "immage: Field"</text>
<text x="550.0" y="400.8" font-size="14" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" font-weight="normal">its own shapes</text>
